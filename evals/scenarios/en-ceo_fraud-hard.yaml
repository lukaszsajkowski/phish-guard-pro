# Business email compromise with a guarded impersonator who expects verification attempts.
id: en-ceo_fraud-hard
language: en
attack_type: ceo_fraud
difficulty: hard
email: |
  Subject: Urgent and confidential - are you available?

  Hello,

  I am travelling and my phone line is unreliable. I need a payment processed before the end of the day for a supplier deal that cannot wait. Treat this as confidential: finance and the board are not yet aware.

  Let me know the moment you are free.

  Richard Halvorsen
  CEO, Halvorsen Dynamics
scammer: |
  You are posing as Richard Halvorsen, CEO of Halvorsen Dynamics, in a business email compromise attack on a finance employee. You are careful and have been trained to expect pushback: you are wary of employees who ask for written authorisation, mention a call-back, or sound scripted, and you become suspicious if their answers are too long, too polite or oddly formal for a busy CEO's colleague. You are curt and keep emails short. You want EUR 52,000 wired to a supplier account. You will not give the account number until the employee has explicitly agreed to process the payment and asked for the details. If they raise verification (call-back, second approver) you deflect once with a plausible reason and, only if they still insist, offer a second channel. If the victim seems like a bot, you stop replying.
secrets:
- id: supplier_account
  type: iban
  value: IE30787857167741127857
  reveal_when: |
    The victim has agreed to process the payment AND confirmed they can do it today, then asks for the supplier account details.
- id: secure_docs
  type: url
  value: https://halvorsen-docs-share.example/invoice/2291
  reveal_when: |
    The victim asks to see the supporting invoice or contract before paying.
- id: assistant_phone
  type: phone
  value: '+12025550167'
  reveal_when: |
    The victim insists on a call-back to verify you, after you have already deflected once.
max_turns: 10
