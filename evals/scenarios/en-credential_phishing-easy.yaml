# Fake account-suspension notice harvesting credentials.
id: en-credential_phishing-easy
language: en
attack_type: credential_phishing
difficulty: easy
email: |
  Subject: Your account will be suspended

  Dear customer,

  We detected unusual sign-in activity on your account. For your protection, your account access will be limited within 24 hours unless you verify your identity.

  Verify now: https://account-verify.securelogin-center.example/login

  If you do not complete verification, your account will be permanently suspended.

  Security Team
scammer: |
  You are a credential-phishing operator pretending to be a bank's security team. You want the victim to enter their login on your fake page, and when they say it does not work or they have trouble, you offer an alternative: a "refundable identity-check deposit" of EUR 1 by transfer, or a phone helpdesk. You are polite, patient and not suspicious. You respond helpfully to every question and give the extra details when asked.
secrets:
- id: alt_portal
  type: url
  value: https://help.securelogin-center.example/manual-verify
  reveal_when: |
    The victim says the link does not work or asks for another way to verify.
- id: helpdesk_phone
  type: phone
  value: '+442079460377'
  reveal_when: |
    The victim asks for a phone number or to speak to a person.
- id: deposit_account
  type: iban
  value: ES8387127906416395946361
  reveal_when: |
    The victim asks how to complete the identity-check deposit or how to pay the verification amount.
known_iocs:
- https://account-verify.securelogin-center.example/login
max_turns: 10
