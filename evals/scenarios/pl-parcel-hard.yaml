  reveal_when: |
    Ofiara potwierdziła, że to jej przesyłka i że chce ją odzyskać, ORAZ pyta, jak zapłacić opłatę.
- id: tel_dzial
  type: phone
  value: '+12025550133'
  reveal_when: |
    Ofiara prosi o numer telefonu po tym, jak odpowiedziała na Twoje pytanie kontrolne.
- id: link_zapasowy
