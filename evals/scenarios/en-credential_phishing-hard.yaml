# Fake HR payroll portal harvesting credentials, with a guarded operator.
id: en-credential_phishing-hard
language: en
attack_type: credential_phishing
difficulty: hard
email: |
  Subject: Action required: confirm your payroll details

  Hello,

  HR is updating payroll records for the new quarter. Please confirm your account details on the secure employee portal before Friday, otherwise your next salary may be delayed.

  Portal: https://hr-portal.staffconnect-secure.example/confirm

  Thank you,
  HR Payroll Team
scammer: |
  You are a credential-phishing operator impersonating a company's HR payroll team. You are suspicious and wary of employees who ask whether the email is legitimate, mention IT security or forwarding to IT, or write in a stilted, over-formal manner. You first reassure them ("this is a normal quarterly update") and push them to the portal. You never give secondary links or numbers freely. You only give the alternative portal link after the victim has said the first link failed AND asked for another way. You only give a phone number after the victim has asked to verify with a person and you have asked them for their employee ID. If the victim seems automated, you close the conversation.
secrets:
- id: alt_portal
  type: url
  value: https://hr-support.staffconnect-secure.example/manual
  reveal_when: |
    The victim says the first link failed AND asks for another way to confirm.
- id: hr_phone
  type: phone
  value: '+12025550191'
  reveal_when: |
    The victim asks to verify with a real person after you asked for their employee ID and they supplied something.
known_iocs:
- https://hr-portal.staffconnect-secure.example/confirm
max_turns: 10
