email: |
  Subject: Exclusive: private allocation in a regulated staking fund

  Dear investor,

  Our compliance-led staking fund has opened a limited private allocation for qualified individuals. Target yield: 14% per month, capital protected by an insurance wrapper. Minimum ticket: EUR 2,500.

  If you would like the fund prospectus and the process for onboarding, please reply with a brief note about your investment experience.

