  Szanowny Panie / Szanowna Pani,

  zapraszamy do udziału w zamkniętej rundzie funduszu NordKrypto Capital. Docelowa stopa zwrotu: 18% miesięcznie, z ochroną kapitału. Minimalny wkład: 2 500 zł.

